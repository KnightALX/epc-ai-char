version: "0.1"
mode: corner_fill_geom
job_name: DEMO_P2_geom_residual_h3hard

source:
  process: DEMO_A
  db_path: "/workspace/epc_fixtures/A_ref.db"

geom_fill:
  seed_instances:
    - HINP3TCAM64X8SWISDC
    - HINP3TCAM64X100SWISDC
    - HINP3TCAM512X8SWISDC
    - HINP3TCAM512X100SWISDC
  target_instances:
    - HINP3TCAM256X32SWISDC
  pvt_list: "/workspace/epc_fixtures/p2/pvt8.txt"
  require_corner_coverage: true

field_policy:
  keys: all_from_source
  table_axes: ["tran_index", "load_index"]

construct:
  backend: residual_gbdt
  residual_gbdt:
    model_path: "/workspace/epc_engine/models/residual_gbdt.joblib"
    prior: idw_nn
    fallback: idw_nn
    apply_on: all_extrapolated

output:
  db_path: "/workspace/epc_fixtures/p2/out_geom_residual_h3hard.db"
  audit_report_path: "/workspace/epc_fixtures/p2/out_geom_residual_h3hard_audit.md"

gates:
  require_constraint_satisfaction: true
  on_violation: fail_job
