# P1 green: relative_improve_vs_source sugar → atomic relative_delta
# 2∈A instances × 2∈A pvts; speed 4% / power 5%; abbreviated keys (≥2 each)
version: "0.1"
job_name: "P1_improve_green"

source:
  process: "DEMO_A"
  db_path: "/workspace/epc_fixtures/A_ref.db"

target:
  process: "DEMO_B"
  instance_list_path: "/workspace/epc_fixtures/B_instance_list.txt"
  pvt_list_path: "/workspace/epc_fixtures/B_pvt_list.txt"

field_policy:
  keys: all_from_source
  table_axes: ["tran_index", "load_index"]

style_from_source:
  enabled: true

construct:
  backend: residual_gbdt
  residual_gbdt:
    model_path: "/workspace/epc_engine/models/residual_gbdt.joblib"
    prior: idw_nn
    fallback: idw_nn
    apply_on: all_extrapolated

constraints:
  - type: table_upper_bound
    instances: ["HINP3TCAM512X100SWISDC"]
    pvts: ["SSGNP_0P99V_0P99V_125C"]
    keys: ["tselr1_min_period"]
    table_cells: "all_cells"
    target:
      mode: range
      op: "<="
      value: 1500
      unit: "ps"

  - type: relative_improve_vs_source
    instances: ["HINP3TCAM64X8SWISDC", "HINP3TCAM512X100SWISDC"]
    pvts: ["TT_0P80V_0P80V_25C", "SSGNP_0P99V_0P99V_125C"]
    table_cells: "all_cells"
    speed_keys: ["tcq", "taccess"]
    power_keys: ["leakage_vddc", "read_power_vddc"]
    speed_improve_pct: 4
    power_improve_pct: 5
    baseline: source_aligned
    allow_proxy_baseline: true

output:
  db_path: "/workspace/epc_fixtures/p1/B_out.p1_green.db"
  audit_report_path: "/workspace/epc_fixtures/p1/B_out.p1_green_audit.md"

gates:
  require_constraint_satisfaction: true
  on_violation: fail_job
