# R2: B∉A instance + allow_proxy_baseline:false → FAIL, no B.db
version: "0.1"
job_name: "P1_R2_proxy_forbid"

source:
  process: "DEMO_A"
  db_path: "/workspace/epc_fixtures/A_ref.db"

target:
  process: "DEMO_B"
  instance_list_path: "/workspace/epc_fixtures/B_instance_list.txt"
  pvt_list_path: "/workspace/epc_fixtures/B_pvt_list.txt"

field_policy:
  keys: all_from_source
  table_axes: ["tran_index", "load_index"]

style_from_source:
  enabled: true

construct:
  backend: residual_gbdt
  residual_gbdt:
    model_path: "/workspace/epc_engine/models/residual_gbdt.joblib"
    prior: idw_nn
    fallback: idw_nn
    apply_on: all_extrapolated

constraints:
  - type: relative_improve_vs_source
    instances: ["HINP3TCAM128X64SWISDC"]  # ∉ A
    pvts: ["TT_0P80V_0P80V_25C"]
    table_cells: "all_cells"
    speed_keys: ["tcq"]
    power_keys: ["leakage_vddc"]
    speed_improve_pct: 4
    power_improve_pct: 5
    baseline: source_aligned
    allow_proxy_baseline: false

output:
  db_path: "/workspace/epc_fixtures/p1/B_out.p1_r2.db"
  audit_report_path: "/workspace/epc_fixtures/p1/B_out.p1_r2_audit.md"

gates:
  require_constraint_satisfaction: true
  on_violation: fail_job
